<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact | Gadi Tonny Darius</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="mainstyles.css">
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
		<div class="container">
			<a class="navbar-brand fw-bold" href="index.html">Gadi Tonny Darius</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="mainNavbar">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
					<li class="nav-item"><a class="nav-link" href="about.html">About Me</a></li>
					<li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
					<li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Contact</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<header class="hero-section text-center text-white">
		<div class="container">
			<p class="text-uppercase mb-2">Get in touch</p>
			<h1 class="display-4 fw-bold">Contact Me</h1>
			<p class="lead mt-3 mb-0">Send me a message about my studies, projects, or work.</p>
		</div>
	</header>

	<main class="container py-5">
		<section class="col-lg-8 col-xl-7 mx-auto" aria-labelledby="form-title">
				<h2 class="section-title mb-3" id="form-title">Send a Message</h2>
				<form class="contact-form" action="mailto:tonnydarius4@gmail.com" method="post" enctype="text/plain">
					<div class="mb-3">
						<label for="fullName" class="form-label">Full Name</label>
						<input type="text" class="form-control" id="fullName" name="Full Name" required>
					</div>
					<div class="mb-3">
						<label for="emailAddress" class="form-label">Email Address</label>
						<input type="email" class="form-control" id="emailAddress" name="Email Address" required>
					</div>
					<div class="mb-3">
						<label for="subject" class="form-label">Subject</label>
						<input type="text" class="form-control" id="subject" name="Subject" required>
					</div>
					<div class="mb-3">
						<label for="message" class="form-label">Message</label>
						<textarea class="form-control" id="message" name="Message" rows="5" required></textarea>
					</div>
					<button type="submit" class="btn btn-primary">Submit</button>
					<p class="form-text mt-3 mb-0">Submitting opens your email app to send the message.</p>
				</form>
		</section>
	</main>

	<footer class="bg-dark text-white text-center py-4">
		<div class="container">
			<p class="mb-2">&copy; 2026 Gadi Tonny Darius</p>
			<a href="index.html" class="text-white me-3">Home</a>
			<a href="about.html" class="text-white me-3">About</a>
			<a href="gallery.html" class="text-white me-3">Gallery</a>
			<a href="contact.html" class="text-white">Contact</a>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
